<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アプリアイコン案 ギャラリー</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; background: #F7F7F5; margin: 0; padding: 32px 16px; color: #222; }
  h1 { font-size: 20px; margin: 0 0 24px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; max-width: 960px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #E3E3E0; border-radius: 12px; padding: 20px; text-align: center; }
  .card img { width: 96px; height: 96px; display: block; margin: 0 auto 12px; border-radius: 20px; }
  .card h2 { font-size: 14px; margin: 0 0 6px; }
  .card p { font-size: 12px; color: #666; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<h1>アプリアイコン デザイン案（Fable作成）</h1>
<div class="grid">
  <div class="card"><img src="icon-1-clock-chart.svg" alt="時計とグラフ"><h2>案1: 時計とグラフ</h2><p>時間と集計・分析を対角配置</p></div>
  <div class="card"><img src="icon-2-gantt-bars.svg" alt="ガントバー"><h2>案2: ガントバー</h2><p>段違いの3本の横棒でスケジュールを象徴</p></div>
  <div class="card"><img src="icon-3-progress-ring.svg" alt="進捗リング"><h2>案3: 進捗リング</h2><p>消化率のリング＋完了チェック</p></div>
  <div class="card"><img src="icon-4-calendar-check.svg" alt="カレンダーチェック"><h2>案4: カレンダーチェック</h2><p>日付単位の入力をカレンダーで表現</p></div>
  <div class="card"><img src="icon-5-frame-and-fill.svg" alt="枠と実"><h2>案5: 枠と実</h2><p>見積（枠）と実績（実）のズレを抽象化</p></div>
  <div class="card"><img src="icon-6-timesheet-grid.svg" alt="タイムシート"><h2>案6: タイムシート</h2><p>3×3マス目で工数入力表を象徴</p></div>
</div>
</body>
</html>
