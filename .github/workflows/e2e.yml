# 実ブラウザスモーク: PR と ui-scaling への push で起動・全タブ描画・コンソールエラー0 を検証する。
# ブランチ保護の required check（名前: e2e）。
name: e2e

on:
  pull_request:
  push:
    branches: [experiment/ui-scaling]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # ブラウザ本体をキャッシュ（キーは lockfile = @playwright/test のバージョンに追随）
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # --with-deps を使わない: apt がミラー取得直後にハングし 15 分タイムアウトを
      # 2 連続で起こした実績あり（run 32272106065）。ubuntu-latest イメージは
      # Chrome 相当の共有ライブラリを同梱しており、chromium は apt なしで起動できる。
      # 万一ライブラリ不足で起動失敗する場合はこのステップに install-deps を戻すこと。
      - run: npx playwright install chromium
        timeout-minutes: 6
      - run: npm run e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
