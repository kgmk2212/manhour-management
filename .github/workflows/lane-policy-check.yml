# lane:auto ラベルの PR が触禁パスに触れていないことを機械検査する（LLMの自己申告に依存しない壁）。
# lane:auto 以外の PR は pass-through。ブランチ保護の required check（名前: lane-policy-check）。
# 検査スクリプトと policy は PR 側から書き換えられないよう base ref のものを使う。
name: lane-policy-check

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  lane-policy-check:
    name: lane-policy-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout base ref（PR側からの書き換え防止）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check forbidden paths
        shell: bash
        run: |
          LANE=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'lane:auto') }}" = "true" ]; then
            LANE="lane:auto"
          fi
          # rename の旧パス（previous_filename）も検査対象に含める
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | node scripts/pipeline/check-lane-policy.mjs --policy .github/pipeline/auto-lane-policy.json --lane "$LANE"
